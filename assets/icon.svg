<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- JoinSuite icon: doorway + enter/exit arrows (flat design) -->

  <!-- background -->
  <rect x="0" y="0" width="256" height="256" rx="52" fill="#14B8A6"/>

  <!-- door frame -->
  <rect x="86" y="40" width="84" height="176" rx="10" fill="#FFFFFF"/>
  <rect x="102" y="56" width="52" height="160" rx="6" fill="#14B8A6"/>

  <!-- door knob -->
  <circle cx="161" cy="132" r="5" fill="#0F766E"/>

  <!-- enter arrow (green, pointing into the door) -->
  <g fill="#22C55E">
    <rect x="16" y="88" width="40" height="16" rx="8"/>
    <polygon points="54,78 54,114 86,96"/>
  </g>

  <!-- exit arrow (orange, pointing away from the door) -->
  <g fill="#FB923C">
    <rect x="172" y="152" width="36" height="16" rx="8"/>
    <polygon points="206,144 206,176 238,160"/>
  </g>
</svg>
